name: Manual macOS source compile
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile native SwiftUI app (no launch)
        shell: bash
        run: |
          set -o pipefail
          swift --version
          swift build 2>&1 | tee swift-build.log
      - name: Install locked gateway dependencies and compile
        working-directory: gateway
        shell: bash
        run: |
          set -o pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build 2>&1 | tee gateway-build.log
      - name: Retain compile logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-compile-logs
          path: |
            swift-build.log
            gateway/gateway-build.log
